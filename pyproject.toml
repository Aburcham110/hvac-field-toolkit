[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-field-toolkit"
version = "0.1.0"
description = "Educational HVAC/R field tools — superheat, electrical, psychrometrics, load, diagnostics, and checklists"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aburcham110"}]
keywords = ["hvac", "refrigeration", "field-tools", "superheat", "psychrometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hvac-sh-sc = "hvac_field_toolkit.superheat:main"
hvac-electrical = "hvac_field_toolkit.electrical:main"
hvac-psych = "hvac_field_toolkit.psychrometrics:main"
hvac-airflow = "hvac_field_toolkit.airflow:main"
hvac-duct-static = "hvac_field_toolkit.duct_static:main"
hvac-charge = "hvac_field_toolkit.charge:main"
hvac-compressor = "hvac_field_toolkit.compressor_diag:main"
hvac-txv-eev = "hvac_field_toolkit.txv_eev:main"
hvac-vacuum = "hvac_field_toolkit.vacuum:main"
hvac-leak-rate = "hvac_field_toolkit.leak_rate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
